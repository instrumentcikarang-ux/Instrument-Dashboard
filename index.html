<!DOCTYPE html>
<html lang="id">
<head>
<base target="_blank">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instrument PM &amp; Trouble Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#14202B; --muted:#5B6B73; --paper:#F2F5F4; --panel:#FFFFFF; --line:#D8DFDC; --soft:#EAF0EE;
  --done:#0F766E; --notyet:#64748B; --need:#B7791F; --sp:#7C5CD6; --backlog:#B42318;
  --z1:#B42318; --z2:#B7791F; --z3:#1D4ED8; --z4:#64748B; --accent:#0F766E; --focus:#1D4ED8;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#E6EDEA; --muted:#98A8A3; --paper:#0F1715; --panel:#17211E; --line:#2A3834; --soft:#1E2B27;
    --done:#2DD4BF; --notyet:#94A3B8; --need:#E3A93B; --sp:#A78BFA; --backlog:#F0786C;
    --z1:#F0786C; --z2:#E3A93B; --z3:#6EA0FF; --z4:#94A3B8; --accent:#2DD4BF; --focus:#6EA0FF;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:20px 20px 60px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;object-fit:contain;flex:none}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn[disabled]{opacity:.55;cursor:wait}

.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(112px,1fr);gap:0;overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:22px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;padding:12px 14px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:112px}
.tile:last-child{border-right:0}
.tile:hover{background:var(--soft)}
.tile.sel{background:var(--soft);box-shadow:inset 0 -3px 0 var(--accent)}
.tile .tm{font-weight:600;display:flex;justify-content:space-between;gap:6px}
.tile .now{font-size:11px;font-weight:500;color:var(--accent)}
.tile .tp{font-size:22px;font-weight:700;letter-spacing:-.02em}
.tile .tp.na{color:var(--muted);font-weight:500}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--done)}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.7}
.tile .tc,.tile .tt{font-size:12px;color:var(--muted)}
.tile .tt strong{color:var(--ink);font-weight:600}

nav.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px}
nav.tabs button{all:unset;cursor:pointer;padding:8px 2px 10px;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.panel h2{font-size:15px;margin:0 0 10px;font-weight:600}
.panel h2 small{font-weight:400;color:var(--muted);margin-left:6px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.mt{margin-top:16px}
.kpis{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.kpi{flex:1 1 180px;padding:14px 18px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .l{color:var(--muted);font-size:13px;margin-top:2px}
.chartbox{position:relative;height:260px}
.chartbox.tall{height:300px}

.meter{height:12px;background:var(--line);border-radius:6px;position:relative;overflow:hidden}
.meter i{display:block;height:100%;background:var(--done)}
.meter b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.meterlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px;gap:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chipbtn{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:5px 10px;display:flex;gap:8px;align-items:center;font-size:13px}
.chipbtn:hover{border-color:var(--accent)}
.chipbtn.on{background:var(--soft);border-color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px;align-items:center}
.toolbar select,.toolbar input[type=search]{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 9px;min-width:130px}
.toolbar label.chk{display:flex;gap:6px;align-items:center;cursor:pointer}
.toolbar .cnt{margin-left:auto;color:var(--muted);font-size:13px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;font-size:12.5px;color:var(--muted);background:var(--soft);position:sticky;top:0;white-space:nowrap}
td.num,th.num{text-align:right}
td small{display:block;color:var(--muted);font-size:12px}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.st-done{color:var(--done)}.st-notyet{color:var(--notyet)}.st-need{color:var(--need)}.st-sp{color:var(--sp)}.st-backlog{color:var(--backlog)}
.tp-Z1{color:var(--z1)}.tp-Z2{color:var(--z2)}.tp-Z3{color:var(--z3)}.tp-Z4{color:var(--z4)}
.late{color:var(--backlog);font-size:12px;font-weight:500}
.more{display:block;margin:12px auto 0}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{color:var(--muted);font-size:12.5px;margin-top:8px}
#loading,#err{padding:60px 20px;text-align:center;color:var(--muted)}
#err{color:var(--backlog)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
